name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Reject tracked restricted sources
        run: python .github/scripts/check_tracked_files.py

      - name: Validate and build public data
        run: |
          python scripts/validate_data.py
          python scripts/build_data.py

      - name: Copy phrases into Pages artifact
        run: python .github/scripts/prepare_pages.py

      - name: Run unit and static-site smoke tests
        run: python -m unittest discover -s tests -v

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5
