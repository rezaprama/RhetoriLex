[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rhetorilex"
version = "0.1.0"
description = "Offline, evidence-aware academic rhetoric templates"
requires-python = ">=3.10"
dependencies = []
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Reza Prama" }]
keywords = ["academic-writing", "rhetoric", "phrasebank", "offline"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

[project.scripts]
rhetorilex = "rhetorilex.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rhetorilex = ["resources/*.json"]

[tool.unittest]
start-directory = "tests"
